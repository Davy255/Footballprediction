<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff85"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Ball Shading Gradient -->
    <radialGradient id="ballShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Ball Inner Shadow -->
    <radialGradient id="ballShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.4)"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Disk -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Glowing Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#glow)" opacity="0.85"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>

  <!-- Football Group -->
  <g transform="translate(256, 256)">
    <!-- Ball Drop Shadow -->
    <circle cx="6" cy="12" r="150" fill="rgba(0,0,0,0.5)" filter="url(#glow)"/>

    <!-- Ball Outer Base -->
    <circle cx="0" cy="0" r="148" fill="url(#ballShade)" stroke="#1e293b" stroke-width="4"/>

    <!-- Football Pentagons & Seams -->
    <!-- Center Pentagon -->
    <polygon points="0,-48 46,-15 28,40 -28,40 -46,-15" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>

    <!-- Top Pentagon/Edge -->
    <polygon points="0,-146 -32,-112 -20,-88 20,-88 32,-112" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <line x1="0" y1="-48" x2="0" y2="-88" stroke="#1e293b" stroke-width="4"/>

    <!-- Top-Right Pentagon/Edge -->
    <polygon points="120,-85 140,-50 115,-30 85,-45 92,-75" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <line x1="46" y1="-15" x2="85" y2="-45" stroke="#1e293b" stroke-width="4"/>

    <!-- Bottom-Right Pentagon/Edge -->
    <polygon points="110,95 138,55 105,45 80,75 88,110" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <line x1="28" y1="40" x2="80" y2="75" stroke="#1e293b" stroke-width="4"/>

    <!-- Bottom-Left Pentagon/Edge -->
    <polygon points="-110,95 -138,55 -105,45 -80,75 -88,110" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <line x1="-28" y1="40" x2="-80" y2="75" stroke="#1e293b" stroke-width="4"/>

    <!-- Top-Left Pentagon/Edge -->
    <polygon points="-120,-85 -140,-50 -115,-30 -85,-45 -92,-75" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <line x1="-46" y1="-15" x2="-85" y2="-45" stroke="#1e293b" stroke-width="4"/>

    <!-- Seam connections between edge pentagons -->
    <line x1="20" y1="-88" x2="92" y2="-75" stroke="#1e293b" stroke-width="3"/>
    <line x1="115" y1="-30" x2="105" y2="45" stroke="#1e293b" stroke-width="3"/>
    <line x1="88" y1="110" x2="-88" y2="110" stroke="#1e293b" stroke-width="3"/>
    <line x1="-115" y1="-30" x2="-105" y2="45" stroke="#1e293b" stroke-width="3"/>
    <line x1="-20" y1="-88" x2="-92" y2="-75" stroke="#1e293b" stroke-width="3"/>

    <!-- 3D Spherical Highlight Overlay -->
    <circle cx="0" cy="0" r="148" fill="url(#ballShadow)"/>

    <!-- Light reflection shine on top left of ball -->
    <ellipse cx="-45" cy="-55" rx="55" ry="32" transform="rotate(-30 -45 -55)" fill="rgba(255, 255, 255, 0.45)"/>
  </g>

  <!-- Golden Prediction Spark Star (Top Right) -->
  <g transform="translate(395, 115)" filter="url(#starGlow)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>
</svg>
